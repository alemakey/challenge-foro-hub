# Puerto de la API
server.port=8080

# Perfil activo por defecto
spring.profiles.active=dev

# =====================
# Base de datos H2 (desarrollo en memoria)
# =====================
spring.datasource.url=jdbc:h2:mem:foro_hub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway gestiona el esquema
spring.flyway.enabled=true

# Consola H2 desactivada por defecto — se activa solo en perfil 'dev'
spring.h2.console.enabled=false

# =====================
# Configuración MySQL (producción)
# Descomentar y reemplazar las variables de entorno
